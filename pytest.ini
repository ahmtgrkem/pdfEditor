[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Uzun traceback'te pytest, silinmiş Qt nesnelerinin repr'ini almaya çalışıp
# çökebiliyor; kısa traceback hem güvenli hem okunaklı.
addopts = --tb=short -ra --strict-markers
markers =
    gui: gerçek pencere gerektiren testler
    slow: uzun süren testler
filterwarnings =
    ignore::DeprecationWarning
